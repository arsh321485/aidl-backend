<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}AIDL{% endblock %}</title>
<link rel="icon" href="/static/aidl/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sign-yellow: #FFCC00;
    --signal-green: #2EC866;
    --signal-amber: #F2B301;
    --signal-red: #E23A2E;
    --asphalt: #14140F;
    --cream: #F5ECD2;
    --muted: #6A624A;
    --slack-bg: #1A1D21;
    --slack-green: #007A5A;
    --text: #1D1C1D;
    --text-2: #616061;
    --line: #E0DCCC;
    --ok: #1A7F37;
    --ok-bg: #DFF6DD;
    --bad: #C0392B;
    --bad-bg: #FDE7E9;
    --wait: #A16207;
  }

  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: Slack-Lato, Lato, -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--slack-bg);
    color: var(--text);
    padding: 12px 16px 64px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  button, input, select { font: inherit; }
  :focus-visible { outline: 3px solid var(--sign-yellow); outline-offset: 2px; }

  /* ---------- preview banner ---------- */
  .preview-banner {
    background: #2B2D31; color: #D1D2D3; border: 1px dashed #494B4F; border-radius: 6px;
    font-size: 12.5px; padding: 8px 12px; margin-bottom: 10px; line-height: 1.4;
  }
  .preview-banner b { color: var(--sign-yellow); }

  /* ---------- tab bar: wraps on wide screens, scrolls sideways on phones ---------- */
  .card-tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10; background: var(--slack-bg);
    padding: 10px 0 14px; margin-bottom: 8px;
  }
  .tab-btn {
    font-size: 13px; font-weight: 700; padding: 8px 14px; min-height: 36px;
    border-radius: 20px; border: 1px solid #494B4F; background: #232529; color: #D1D2D3;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .tab-btn:hover { background: #2B2D31; }
  .tab-btn[aria-selected="true"] { background: var(--sign-yellow); border-color: var(--sign-yellow); color: var(--asphalt); }

  .card-section[hidden] { display: none; }
  .section-label { color: #fff; font-size: 15px; font-weight: 900; margin: 0 0 12px; line-height: 1.35; }
  .section-label span { color: #8A8D91; font-weight: 400; font-size: 12px; margin-left: 6px; white-space: nowrap; }

  /* ---------- Slack message frame ---------- */
  .msg { background: #fff; border-radius: 8px; padding: 14px 16px; margin-bottom: 24px; }
  .msg-row { display: flex; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 6px; background: var(--asphalt); flex-shrink: 0; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .msg-col { flex: 1; min-width: 0; }
  .app-line { font-size: 15px; margin-bottom: 6px; line-height: 1.3; }
  .bot-name { font-weight: 900; }
  .bot-tag { background: #E8E8E8; color: var(--text-2); font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
  .org-tag { color: var(--text-2); font-size: 13px; }
  .header-block { font-size: 17px; font-weight: 900; margin: 2px 0 6px; line-height: 1.3; }
  .section-text { font-size: 15px; line-height: 1.5; margin: 6px 0; overflow-wrap: anywhere; }
  .context-line { font-size: 13px; color: var(--text-2); margin-top: 10px; overflow-wrap: anywhere; }
  .next-hint { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; font-weight: 700; color: var(--slack-green); }
  .next-hint.done { color: var(--muted); }
  .label-caps { font-size: 10.5px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase; color: var(--muted); }

  /* ---------- buttons ---------- */
  .actions-row { display: flex; gap: 8px; margin: 12px 0 2px; flex-wrap: wrap; align-items: center; }
  .slack-btn {
    font-size: 15px; font-weight: 700; padding: 6px 14px; min-height: 36px;
    border-radius: 4px; border: 1px solid #BABCBF; background: #fff; color: var(--text); cursor: pointer;
  }
  .slack-btn:hover { background: #F8F8F8; }
  .slack-btn.primary { background: var(--slack-green); border-color: var(--slack-green); color: #fff; }
  .slack-btn.primary:hover { background: #148567; }
  .slack-btn.sm { padding: 4px 10px; min-height: 30px; font-size: 13px; }
  .slack-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- form fields ---------- */
  .field { margin-bottom: 12px; }
  .field label { display: block; margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; font-size: 15px; padding: 8px 10px; min-height: 40px; border-radius: 6px;
    border: 1px solid #BABCBF; background: #fff; color: var(--text);
  }
  .field input:focus { border-color: var(--slack-green); }

  /* ---------- traffic light icon (shared) ---------- */
  .tl-icon { display: inline-flex; flex-direction: column; gap: 2px; flex-shrink: 0; background: var(--asphalt); border-radius: 4px; padding: 3px; vertical-align: middle; }
  .tl-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.18); display: block; }
  .tl-dot.on.r { background: var(--signal-red); box-shadow: 0 0 5px 1px rgba(226,58,46,.85); }
  .tl-dot.on.a { background: var(--signal-amber); box-shadow: 0 0 5px 1px rgba(242,179,1,.85); }
  .tl-dot.on.g { background: var(--signal-green); box-shadow: 0 0 5px 1px rgba(46,200,102,.85); }
  .data-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .data-dot.g { background: var(--signal-green); }
  .data-dot.a { background: var(--signal-amber); }
  .data-dot.r { background: var(--signal-red); }

  /* ---------- modal: centred dialog, bottom sheet on phones ---------- */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(10,10,7,.6);
    z-index: 100; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: min(540px, 100%); max-height: 86vh; background: #fff; border-radius: 10px;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid #E5E1D0; background: var(--cream); }
  .modal-head h3 { font-size: 17px; font-weight: 900; color: var(--asphalt); line-height: 1.3; margin-top: 4px; }
  .modal-close { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--asphalt); background: #fff; cursor: pointer; font-size: 14px; flex-shrink: 0; }
  .modal-meta { font-size: 12px; color: var(--text-2); padding: 10px 20px; border-bottom: 1px solid #EEE; font-family: "JetBrains Mono", monospace; overflow-wrap: anywhere; }
  .modal-body { padding: 16px 20px; overflow-y: auto; }
  .modal-body p { font-size: 14px; line-height: 1.6; color: #3A3626; }
  .modal-body p + p { margin-top: 10px; }
  .modal-foot { display: flex; flex-direction: column; gap: 10px; padding: 14px 20px; border-top: 1px solid #EEE; background: #FAFAFA; }
  .modal-foot-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .modal-status { font-size: 13px; font-weight: 700; color: var(--muted); }
  .modal-status.ok { color: var(--ok); }
  .warn-text { font-size: 12.5px; font-weight: 700; color: var(--bad); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px);
    background: var(--asphalt); color: #fff; font-size: 13.5px; font-weight: 700;
    padding: 10px 16px; border-radius: 8px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 200; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- phones ---------- */
  @media (max-width: 560px) {
    body { padding: 8px 12px 48px; }
    .card-tabs {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      margin: 0 -12px 6px; padding: 8px 12px 12px; scroll-snap-type: x proximity;
    }
    .card-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { scroll-snap-align: start; }
    .msg { padding: 12px; border-radius: 6px; }
    .avatar { width: 30px; height: 30px; }
    .header-block { font-size: 16px; }
    .section-text { font-size: 14.5px; }
    .modal-backdrop { padding: 0; align-items: flex-end; }
    .modal { width: 100%; max-height: 92vh; border-radius: 14px 14px 0 0; }
    .modal-foot-row > .slack-btn { flex: 1 1 auto; }
  }
  @media (max-width: 360px) {
    .msg-row { gap: 8px; }
    .avatar { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
{% block styles %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
  {% if d.demo %}
  <div class="preview-banner"><b>Preview</b> · demo data from the AIDL Slack guide. Open this page from Slack to see your organization's data.</div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  // Tabs — one card visible at a time; the hash keeps the tab linkable.
  (function () {
    var buttons = Array.prototype.slice.call(document.querySelectorAll('.tab-btn'));
    var sections = Array.prototype.slice.call(document.querySelectorAll('.card-section'));
    function show(id, focus) {
      if (!document.getElementById('card-' + id)) id = buttons[0] && buttons[0].dataset.tab;
      sections.forEach(function (s) { s.hidden = s.id !== 'card-' + id; });
      buttons.forEach(function (b) {
        var on = b.dataset.tab === id;
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        if (on) {
          b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
          if (focus) b.focus();
        }
      });
    }
    buttons.forEach(function (b, i) {
      b.addEventListener('click', function () {
        show(b.dataset.tab);
        history.replaceState(null, '', '#' + b.dataset.tab);
      });
      b.addEventListener('keydown', function (e) {
        var step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!step) return;
        var next = buttons[(i + step + buttons.length) % buttons.length];
        next.click();
        next.focus();
      });
    });
    window.showCard = show;
    window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
    show((location.hash || '').slice(1));
  })();

  // Modals — close on ✕, backdrop click or Escape.
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  document.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('modal-backdrop')) e.target.classList.remove('open');
    var closer = e.target.closest && e.target.closest('[data-close]');
    if (closer) closeModal(closer.dataset.close);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.modal-backdrop.open').forEach(function (m) { m.classList.remove('open'); });
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
