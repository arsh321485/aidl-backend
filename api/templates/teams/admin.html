<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIDL Admin — {{ active_tab|title }}</title>
  <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
  <style>
    :root {
      --aidl-purple: #5b5fc7;
      --aidl-purple-dark: #4649a8;
      --aidl-bg: #f2f3fb;
      --aidl-card: #ffffff;
      --aidl-text: #201f36;
      --aidl-muted: #6b6f8d;
      --aidl-border: #e6e6f2;
      --aidl-alert: #d13438;
      --aidl-alert-bg: #fdecec;
      --aidl-warn: #b5890a;
      --aidl-link: #5b5fc7;
      --aidl-active: #5b5fc7;
      --aidl-shadow: 0 1px 2px rgba(32, 31, 54, 0.06), 0 8px 24px rgba(32, 31, 54, 0.06);

      /* per-tab accent colors */
      --c-home: #5b5fc7;
      --c-add-admin: #2f7fe0;
      --c-add-user: #7a5fd6;
      --c-policy: #0e9f6e;
      --c-cards: #e8890c;
      --c-ai-apps: #d6408f;
      --c-it-apps: #06a3b8;
      --aidl-subtle: #f8f8fd;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --aidl-bg: #16151f;
        --aidl-card: #1e1d2b;
        --aidl-text: #eeedf7;
        --aidl-muted: #9b9ab5;
        --aidl-border: #322f47;
        --aidl-alert-bg: #3a1e22;
        --aidl-subtle: #262536;
        --aidl-warn: #e0a530;
      }
    }
    :root[data-theme="dark"] {
      --aidl-bg: #16151f;
      --aidl-card: #1e1d2b;
      --aidl-text: #eeedf7;
      --aidl-muted: #9b9ab5;
      --aidl-border: #322f47;
      --aidl-alert-bg: #3a1e22;
      --aidl-subtle: #262536;
      --aidl-warn: #e0a530;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--aidl-bg);
      color: var(--aidl-text);
    }
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 20px 40px;
    }

    /* ---- Top nav: rounded pill tabs, always visible + per-tab accent colors ---- */
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }
    .nav a {
      --accent: var(--aidl-purple);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px 9px 10px;
      border-radius: 999px;
      border: 1px solid var(--aidl-border);
      /* solid fill (not transparent) so inactive pills stay visible in dark theme too */
      background: var(--aidl-subtle);
      color: var(--aidl-text);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .nav a[data-tab-link="home"] { --accent: var(--c-home); }
    .nav a[data-tab-link="add-admin"] { --accent: var(--c-add-admin); }
    .nav a[data-tab-link="add-user"] { --accent: var(--c-add-user); }
    .nav a[data-tab-link="policy"] { --accent: var(--c-policy); }
    .nav a[data-tab-link="cards"] { --accent: var(--c-cards); }
    .nav a[data-tab-link="ai-apps"] { --accent: var(--c-ai-apps); }
    .nav a[data-tab-link="it-apps"] { --accent: var(--c-it-apps); }
    .nav a .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 30%, transparent);
      font-size: 12px;
      line-height: 1;
      transition: background-color .18s ease, transform .18s ease;
    }
    .nav a:hover {
      background: color-mix(in srgb, var(--accent) 20%, var(--aidl-subtle));
      border-color: color-mix(in srgb, var(--accent) 45%, var(--aidl-border));
      transform: translateY(-1px);
    }
    .nav a:hover .nav-icon {
      transform: scale(1.08);
    }
    .nav a.active {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, black));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    .nav a.active .nav-icon {
      background: rgba(255, 255, 255, 0.28);
    }
    .nav a:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 2px;
    }

    .section-label {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .section-sub {
      font-size: 13px;
      color: var(--aidl-muted);
      margin: 0 0 14px;
    }
    .card {
      background: var(--aidl-card);
      border: 1px solid var(--aidl-border);
      border-radius: 24px;
      padding: 28px 30px;
      box-shadow: var(--aidl-shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--aidl-border);
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(32, 31, 54, 0.12);
    }
    .brand-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--aidl-muted);
    }
    .welcome {
      font-size: 23px;
      font-weight: 700;
      margin: 0 0 8px;
      line-height: 1.3;
      color: var(--aidl-text);
    }
    .intro {
      font-size: 14px;
      color: var(--aidl-muted);
      margin: 0 0 22px;
      line-height: 1.5;
      max-width: 640px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat {
      --accent: var(--aidl-purple);
      position: relative;
      background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 10%, var(--aidl-card)), var(--aidl-card) 60%);
      border: 1px solid var(--aidl-border);
      border-radius: 18px;
      padding: 16px 18px 16px 20px;
      box-shadow: 0 2px 6px rgba(32, 31, 54, 0.06);
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .stat::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 999px;
      background: var(--accent);
    }
    .stat:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(32, 31, 54, 0.1);
    }
    .stat:nth-of-type(2) { --accent: var(--c-add-admin); }
    .stat:nth-of-type(3) { --accent: var(--aidl-alert); }
    .stat-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--aidl-muted);
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--aidl-text);
    }
    .stat-value.alert { color: var(--aidl-alert); }
    .stat-sub {
      font-size: 12px;
      color: var(--aidl-muted);
      margin-top: 4px;
    }
    .gov-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--aidl-muted);
      margin: 0 0 12px;
    }
    .gov {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }
    .gov-item {
      background: var(--aidl-subtle);
      border: 1px solid var(--aidl-border);
      border-radius: 18px;
      padding: 15px 17px;
      transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
    }
    .gov-item:hover {
      box-shadow: 0 8px 18px rgba(32, 31, 54, 0.09);
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--aidl-purple) 30%, var(--aidl-border));
    }
    .gov-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--aidl-muted);
      margin-bottom: 8px;
    }
    .gov-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--aidl-purple);
    }
    .gov-sub {
      font-size: 12px;
      color: var(--aidl-muted);
      margin-top: 2px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid var(--aidl-border);
      background: var(--aidl-card);
      color: var(--aidl-text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .btn:hover {
      background: var(--aidl-subtle);
      box-shadow: 0 4px 10px rgba(32, 31, 54, 0.09);
      transform: translateY(-1px);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--aidl-purple), var(--aidl-purple-dark));
      border-color: var(--aidl-purple);
      color: #fff;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--aidl-purple) 40%, transparent);
    }
    .btn.primary:hover {
      background: linear-gradient(135deg, var(--aidl-purple-dark), var(--aidl-purple-dark));
      box-shadow: 0 6px 16px color-mix(in srgb, var(--aidl-purple) 50%, transparent);
    }
    .progress {
      font-size: 12px;
      color: var(--aidl-muted);
    }
    .divider {
      border: 0;
      border-top: 1px solid var(--aidl-border);
      margin: 18px 0 14px;
    }
    .next-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--aidl-link);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .next-link:hover { text-decoration: underline; }
    .placeholder-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    .placeholder-body {
      font-size: 14px;
      line-height: 1.5;
      color: var(--aidl-muted);
      max-width: 560px;
    }
    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--aidl-purple);
      background: color-mix(in srgb, var(--aidl-purple) 10%, transparent);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 14px;
    }
    .item-list {
      display: grid;
      gap: 8px;
    }
    .item-row {
      background: var(--aidl-subtle);
      border: 1px solid var(--aidl-border);
      border-radius: 16px;
      padding: 13px 16px;
      transition: box-shadow .18s ease, transform .18s ease;
    }
    .item-row:hover {
      box-shadow: 0 6px 14px rgba(32, 31, 54, 0.08);
      transform: translateY(-1px);
    }
    .item-row-title {
      font-weight: 700;
      color: var(--aidl-text);
    }
    .invite-row {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .invite-row input {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border: 1px solid var(--aidl-border);
      border-radius: 999px;
      font-size: 13px;
      background: var(--aidl-card);
      color: var(--aidl-text);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .invite-row input:focus {
      outline: none;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--aidl-purple) 22%, transparent);
      border-color: var(--aidl-purple);
    }

    /* ---- Policy tab: colored "live policy" bar + signed/unsigned tiles ---- */
    .policy-live {
      background: linear-gradient(135deg, color-mix(in srgb, var(--c-policy) 16%, var(--aidl-card)), var(--aidl-card) 70%);
      border: 1px solid color-mix(in srgb, var(--c-policy) 35%, var(--aidl-border));
      border-radius: 18px;
      padding: 16px 18px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .policy-live-label {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--c-policy);
    }
    .policy-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--c-policy);
      background: color-mix(in srgb, var(--c-policy) 18%, transparent);
      border-radius: 999px;
      padding: 4px 12px;
      white-space: nowrap;
    }
    .policy-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0 20px;
    }
    .policy-stat {
      background: var(--aidl-subtle);
      border: 1px solid var(--aidl-border);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .policy-stat-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--aidl-muted);
      margin-bottom: 6px;
    }
    .policy-stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--c-policy);
    }
    .policy-stat-value.unsigned { color: var(--aidl-alert); }

    /* ---- AI/IT Apps tabs: flat divider rows + colored status pill ---- */
    .app-list { margin-top: 4px; }
    .app-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 2px;
      border-bottom: 1px solid var(--aidl-border);
    }
    .app-row:last-child { border-bottom: none; }
    .app-row-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--aidl-text);
    }
    .app-row-desc {
      font-size: 12.5px;
      color: var(--aidl-muted);
      margin-top: 3px;
    }
    .app-badge {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .app-badge.approved { color: var(--c-policy); background: color-mix(in srgb, var(--c-policy) 16%, transparent); }
    .app-badge.pending { color: var(--aidl-warn); background: color-mix(in srgb, var(--aidl-warn) 18%, transparent); }
    .app-badge.rejected { color: var(--aidl-alert); background: color-mix(in srgb, var(--aidl-alert) 14%, transparent); }
    /* ---- Add Admin: permission chips ---- */
    .perm-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 4px;
    }
    .perm-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--aidl-border);
      background: var(--aidl-subtle);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--aidl-muted);
      cursor: pointer;
      user-select: none;
    }
    .perm-chip input { margin: 0; }
    .perm-chip:has(input:checked) {
      color: var(--c-add-admin);
      background: color-mix(in srgb, var(--c-add-admin) 14%, transparent);
      border-color: color-mix(in srgb, var(--c-add-admin) 40%, var(--aidl-border));
    }
    .item-row-perms {
      font-size: 11.5px;
      color: var(--aidl-muted);
      margin-top: 4px;
    }

    /* ---- Policy: upload form ---- */
    .policy-upload {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      align-items: center;
    }
    .policy-upload input[type="text"],
    .policy-upload input[type="date"] {
      padding: 10px 14px;
      border: 1px solid var(--aidl-border);
      border-radius: 999px;
      font-size: 13px;
      background: var(--aidl-card);
      color: var(--aidl-text);
    }
    .policy-meta {
      font-size: 12px;
      color: var(--aidl-muted);
      margin-top: 6px;
    }

    /* ---- Cards catalogue ---- */
    .card-quota {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: color-mix(in srgb, var(--c-cards) 14%, var(--aidl-card));
      border: 1px solid color-mix(in srgb, var(--c-cards) 35%, var(--aidl-border));
      border-radius: 16px;
      padding: 12px 16px;
      margin: 14px 0;
      font-size: 12.5px;
      color: var(--aidl-text);
    }
    .card-list { display: grid; gap: 10px; }
    .card-row {
      background: var(--aidl-subtle);
      border: 1px solid var(--aidl-border);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .card-row-title { font-weight: 700; font-size: 14px; }
    .card-row-meta { font-size: 12px; color: var(--aidl-muted); margin-top: 2px; }
    .card-row-desc { font-size: 12.5px; color: var(--aidl-muted); margin-top: 4px; }
    .card-row-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .btn.small { padding: 6px 14px; font-size: 12px; }
    .card-status {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--aidl-border);
      color: var(--aidl-muted);
    }
    .card-status.sent { background: color-mix(in srgb, var(--c-policy) 18%, transparent); color: var(--c-policy); }
    .card-status.requested { background: color-mix(in srgb, var(--aidl-warn) 18%, transparent); color: var(--aidl-warn); }
    .card-status.scheduled { background: color-mix(in srgb, var(--c-add-admin) 18%, transparent); color: var(--c-add-admin); }
    .card-status.failed { background: color-mix(in srgb, var(--aidl-alert) 14%, transparent); color: var(--aidl-alert); }
    .card-schedule-input {
      padding: 6px 10px;
      border: 1px solid var(--aidl-border);
      border-radius: 999px;
      font-size: 12px;
      background: var(--aidl-card);
      color: var(--aidl-text);
    }
    .card-new-request {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--aidl-border);
    }
    .card-new-request input {
      flex: 1;
      min-width: 160px;
      padding: 10px 16px;
      border: 1px solid var(--aidl-border);
      border-radius: 999px;
      font-size: 13px;
      background: var(--aidl-card);
      color: var(--aidl-text);
    }

    /* ---- AI/IT Apps: Add Application form ---- */
    .app-add-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--aidl-border);
    }
    .app-add-form input,
    .app-add-form select {
      padding: 10px 14px;
      border: 1px solid var(--aidl-border);
      border-radius: 999px;
      font-size: 13px;
      background: var(--aidl-card);
      color: var(--aidl-text);
    }
    .app-row-meta2 { font-size: 11.5px; color: var(--aidl-muted); margin-top: 2px; }

    @media (max-width: 720px) {
      .stats { grid-template-columns: 1fr; }
      .gov { grid-template-columns: 1fr 1fr; }
      .card { padding: 20px; }
      .policy-live { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav" aria-label="AIDL Admin Center" id="navBar">
      {% for tab in tabs %}
      <a href="{{ tab.url }}" class="{% if tab.active %}active{% endif %}" data-tab-link="{{ tab.id }}">
        <span class="nav-icon" aria-hidden="true">{{ tab.icon }}</span>
        <span>{{ tab.label }}</span>
      </a>
      {% endfor %}
    </nav>

    <p class="section-label" id="sectionLabel" hidden>Shown the moment an admin opens your Admin Center</p>
    <p class="section-sub" id="sectionSub" hidden>Depot Overview</p>

    <div class="card" id="mainCard">
      <p class="user-chip" id="userChip">Loading signed-in user…</p>
      <div id="cardBody"></div>
    </div>
  </div>

  <script>
    const BASE = "{{ teams_base_url }}";
    const SERVER_DASHBOARD = {{ dashboard_json|safe }};
    const SERVER_PLACEHOLDER = {{ placeholder_json|safe }};

    const INITIAL_TAB = "{{ active_tab }}";
    let activeTab = INITIAL_TAB;
    let currentUser = { fullName: "", orgName: "", email: "" };
    let sessionToken = new URLSearchParams(window.location.search).get("access_token") || "";

    function qsWithUser(extra) {
      const params = new URLSearchParams(window.location.search);
      Object.entries(extra || {}).forEach(([k, v]) => {
        if (v) params.set(k, v);
      });
      return params.toString();
    }

    function tabUrl(tabId) {
      const q = qsWithUser({
        full_name: currentUser.fullName,
        org_name: currentUser.orgName,
        email: currentUser.email,
      });
      return BASE + "/tabs/" + tabId + "/" + (q ? "?" + q : "");
    }

    function applyUserToNav() {
      document.querySelectorAll("[data-tab-link]").forEach((a) => {
        a.setAttribute("href", tabUrl(a.getAttribute("data-tab-link")));
      });
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    function buildHomeHtml(data) {
      const stats = (data.stats || []).map((s) => (
        '<div class="stat">' +
          '<div class="stat-label">' + escapeHtml(s.label) + '</div>' +
          '<div class="stat-value' + (s.alert ? ' alert' : '') + '">' + escapeHtml(s.value) + '</div>' +
          '<div class="stat-sub">' + escapeHtml(s.sub) + '</div>' +
        '</div>'
      )).join("");
      const gov = (data.governance || []).map((g) => (
        '<div class="gov-item">' +
          '<div class="gov-label">' + escapeHtml(g.label) + '</div>' +
          '<div class="gov-value">' + escapeHtml(g.value) + '</div>' +
          '<div class="gov-sub">' + escapeHtml(g.sub) + '</div>' +
        '</div>'
      )).join("");
      return (
        '<div class="brand">' +
          '<img src="' + escapeHtml(data.logo_url) + '" alt="AIDL" />' +
          '<div class="brand-text">AIDL for ' + escapeHtml(data.org_name) + '</div>' +
        '</div>' +
        '<h1 class="welcome">' + escapeHtml(data.welcome_title) + '</h1>' +
        '<p class="intro">' + escapeHtml(data.welcome_body) + '</p>' +
        '<div class="stats">' + stats + '</div>' +
        '<p class="gov-title">GOVERNANCE SNAPSHOT</p>' +
        '<div class="gov">' + gov + '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn primary" id="exportBtn">' + escapeHtml(data.export_label) + '</button>' +
          '<span class="progress">' + escapeHtml(data.progress_text) + '</span>' +
        '</div>' +
        '<hr class="divider" />' +
        '<a class="next-link" id="nextLink" data-tab-link="add-admin" href="' + tabUrl("add-admin") + '">' + escapeHtml(data.next_step) + ' →</a>'
      );
    }

    function buildPlaceholderHtml(tab, data) {
      const items = data.items || [];
      const isAppTab = tab === "ai-apps" || tab === "it-apps";
      let itemsHtml;
      if (tab === "add-user") {
        itemsHtml = "";
      } else if (!items.length) {
        itemsHtml = '<p class="progress">No records yet for this organisation.</p>';
      } else if (isAppTab) {
        // Flat divider-separated rows with a colored status pill on the
        // right, instead of the generic boxed item-list used elsewhere.
        const dataAllowedLabels = {
          public_only: "Public only",
          internal: "Internal",
          internal_confidential: "Internal + Confidential",
          none: "None",
        };
        itemsHtml = '<div class="app-list">' + items.map((it) => {
          const title = it.name || "App";
          const desc = it.description || "";
          const status = (it.status || "pending").toLowerCase();
          const label = status === "rejected" ? "Prohibited" : status.charAt(0).toUpperCase() + status.slice(1);
          const meta2 = [it.category, dataAllowedLabels[it.data_allowed] || ""].filter(Boolean).join(" · ");
          return (
            '<div class="app-row">' +
              '<div class="app-row-main">' +
                '<div class="app-row-title">' + escapeHtml(title) + '</div>' +
                (desc ? '<div class="app-row-desc">' + escapeHtml(desc) + '</div>' : '') +
                (meta2 ? '<div class="app-row-meta2">' + escapeHtml(meta2) + '</div>' : '') +
              '</div>' +
              '<span class="app-badge ' + escapeHtml(status) + '">' + escapeHtml(label) + '</span>' +
            '</div>'
          );
        }).join("") + '</div>';
      } else {
        itemsHtml = '<div class="item-list">' + items.map((it) => {
          const title = it.name || it.email || "Item";
          const meta = [it.email, it.role, it.status].filter(Boolean).join(" · ");
          const desc = it.description || it.sub || "";
          let permsLine = "";
          if (tab === "add-admin" && it.permissions) {
            const on = [];
            if (it.permissions.approve_apps) on.push("Approve Apps");
            if (it.permissions.access_cards) on.push("Access Cards");
            if (it.permissions.create_card) on.push("Create Card");
            permsLine = '<div class="item-row-perms">' + (on.length ? escapeHtml(on.join(" · ")) : "No extra permissions") + '</div>';
          }
          return (
            '<div class="item-row">' +
              '<div class="item-row-title">' + escapeHtml(title) + '</div>' +
              (meta ? '<div class="progress">' + escapeHtml(meta) + '</div>' : '') +
              (desc ? '<div class="progress">' + escapeHtml(desc) + '</div>' : '') +
              permsLine +
            '</div>'
          );
        }).join("") + '</div>';
      }

      let extra = "";
      if (tab === "add-admin") {
        extra = (
          '<p class="progress" style="margin-top:4px;">Promote an existing team member to admin — they must ' +
            'have signed in via Teams at least once before they can be promoted.</p>' +
          '<div class="perm-chips">' +
            '<label class="perm-chip"><input type="checkbox" id="permApproveApps" checked /> Approve Apps</label>' +
            '<label class="perm-chip"><input type="checkbox" id="permAccessCards" checked /> Access Cards</label>' +
            '<label class="perm-chip"><input type="checkbox" id="permCreateCard" checked /> Create Card</label>' +
          '</div>' +
          '<div class="invite-row">' +
            '<input id="promoteAdminEmail" type="email" placeholder="name@company.com" />' +
            '<button type="button" class="btn primary" id="promoteAdminBtn">Send Admin Invite</button>' +
          '</div>' +
          '<p id="promoteAdminMsg" class="progress" style="margin-top:8px;"></p>'
        );
      } else if (tab === "add-user") {
        extra = (
          '<p class="progress" style="margin-top:4px;">Issue a licence to a team member — they get the ' +
            'reference cards and can request more for their channel. No Admin Center access.</p>' +
          '<div class="invite-row">' +
            '<input id="inviteName" type="text" placeholder="Full name" />' +
            '<input id="inviteEmail" type="email" placeholder="name@company.com" />' +
            '<button type="button" class="btn primary" id="inviteBtn">Issue Licence</button>' +
          '</div>' +
          '<p id="inviteMsg" class="progress" style="margin-top:8px;"></p>'
        );
      } else if (tab === "policy") {
        const signed = data.signed_count || 0;
        const unsigned = data.unsigned_count || 0;
        const metaBits = [data.policy_file_name, data.policy_version, data.policy_effective_date ? ("effective " + data.policy_effective_date) : "", data.policy_uploaded_by ? ("uploaded by " + data.policy_uploaded_by) : ""].filter(Boolean);
        extra = (
          '<div class="policy-live">' +
            '<span class="policy-live-label">Current Live Policy</span>' +
            '<span class="policy-live-badge">● Live</span>' +
          '</div>' +
          (metaBits.length ? '<div class="policy-meta">' + escapeHtml(metaBits.join(" · ")) + '</div>' : '') +
          '<div class="policy-stats">' +
            '<div class="policy-stat"><div class="policy-stat-label">Signed</div><div class="policy-stat-value">' + signed + '</div></div>' +
            '<div class="policy-stat"><div class="policy-stat-label">Unsigned</div><div class="policy-stat-value' + (unsigned ? ' unsigned' : '') + '">' + unsigned + '</div></div>' +
          '</div>' +
          (data.policy_url
            ? '<a class="btn primary" id="policyLink" href="' + escapeHtml(data.policy_url) + '" target="_blank" rel="noopener">View Current Policy</a>'
            : '') +
          '<div class="policy-upload">' +
            '<input type="file" id="policyFile" accept="application/pdf" />' +
            '<input type="text" id="policyVersion" placeholder="Version e.g. v3.2" />' +
            '<input type="date" id="policyEffectiveDate" />' +
            '<button type="button" class="btn primary" id="policyPublishBtn">Publish New Version</button>' +
          '</div>' +
          '<p id="policyMsg" class="progress" style="margin-top:8px;"></p>'
        );
      } else if (tab === "ai-apps" || tab === "it-apps") {
        extra = (
          '<div class="app-add-form">' +
            '<input type="text" id="appName" placeholder="App name" />' +
            '<input type="text" id="appCategory" placeholder="Category" />' +
            '<select id="appDataAllowed">' +
              '<option value="">Data allowed…</option>' +
              '<option value="public_only">Public only</option>' +
              '<option value="internal">Internal</option>' +
              '<option value="internal_confidential">Internal + Confidential</option>' +
              '<option value="none">None</option>' +
            '</select>' +
            '<select id="appStatus">' +
              '<option value="pending">Pending</option>' +
              '<option value="approved">Approved</option>' +
              '<option value="rejected">Prohibited</option>' +
            '</select>' +
            '<button type="button" class="btn primary" id="appAddBtn" data-app-type="' + (tab === "ai-apps" ? "ai" : "it") + '">Add Application</button>' +
          '</div>' +
          '<p id="appAddMsg" class="progress" style="margin-top:8px;"></p>'
        );
      }

      return (
        '<div class="brand">' +
          '<img src="' + escapeHtml(data.logo_url) + '" alt="AIDL" />' +
          '<div class="brand-text">AIDL for ' + escapeHtml(data.org_name) + '</div>' +
        '</div>' +
        '<h1 class="placeholder-title">' + escapeHtml(data.heading) + '</h1>' +
        '<p class="placeholder-body">' + escapeHtml(data.body) + '</p>' +
        '<div style="margin-top:16px;">' + itemsHtml + '</div>' +
        extra
      );
    }

    const CARD_STATUS_LABELS = {
      not_sent: "Not sent",
      requested: "Requested",
      sent: "Sent",
      scheduled: "Scheduled",
      failed: "Failed",
    };

    function buildCardsHtml(data) {
      const quotaUsed = data.quota_used || 0;
      const quotaMax = data.quota_max || 10;
      const catalog = data.catalog || [];
      const rows = catalog.map((c) => {
        const statusLabel = CARD_STATUS_LABELS[c.status] || c.status;
        const ratingNum = (c.rating || "").split(" ")[0];
        const metaBits = [c.category, c.price, ratingNum ? ("★" + ratingNum) : ""].filter(Boolean).join(" · ");
        return (
          '<div class="card-row">' +
            '<div class="card-row-title">' + escapeHtml(c.icon || "") + " " + escapeHtml(c.title) + '</div>' +
            '<div class="card-row-meta">' + escapeHtml(metaBits) + '</div>' +
            '<div class="card-row-desc">' + escapeHtml(c.desc || "") + '</div>' +
            '<div class="card-row-actions">' +
              '<span class="card-status ' + escapeHtml(c.status) + '">' + escapeHtml(statusLabel) + '</span>' +
              '<button type="button" class="btn small" data-card-action="request" data-card-id="' + escapeHtml(c.id) + '">Request</button>' +
              '<button type="button" class="btn small primary" data-card-action="send-now" data-card-id="' + escapeHtml(c.id) + '">Send Now</button>' +
              '<input type="datetime-local" class="card-schedule-input" data-card-id="' + escapeHtml(c.id) + '" />' +
              '<button type="button" class="btn small" data-card-action="schedule" data-card-id="' + escapeHtml(c.id) + '">Schedule</button>' +
            '</div>' +
          '</div>'
        );
      }).join("");

      return (
        '<div class="brand">' +
          '<img src="' + escapeHtml(data.logo_url) + '" alt="AIDL" />' +
          '<div class="brand-text">AIDL for ' + escapeHtml(data.org_name) + '</div>' +
        '</div>' +
        '<h1 class="placeholder-title">' + escapeHtml(data.heading) + '</h1>' +
        '<p class="placeholder-body">' + escapeHtml(data.body) + '</p>' +
        '<div class="card-quota"><span>MONTHLY CARD QUOTA</span><strong>' + quotaUsed + ' of ' + quotaMax + ' requested this month</strong></div>' +
        '<div class="card-list">' + rows + '</div>' +
        '<div class="card-new-request">' +
          '<input type="text" id="newCardTitle" placeholder="New card title" />' +
          '<input type="text" id="newCardDesc" placeholder="What should it cover? (optional)" />' +
          '<button type="button" class="btn primary" id="newCardBtn">Request a New Card</button>' +
        '</div>' +
        '<p id="cardsMsg" class="progress" style="margin-top:8px;"></p>'
      );
    }

    function setUserChip(data) {
      const chip = document.getElementById("userChip");
      if (!chip) return;
      if (data.full_name || data.first_name) {
        chip.textContent = data.email
          ? ("Signed in as " + (data.full_name || data.first_name) + " · " + data.email)
          : ("Signed in as " + (data.full_name || data.first_name));
      } else {
        chip.textContent = "Admin Center";
      }
    }

    function setActiveNav(tab) {
      document.querySelectorAll("[data-tab-link]").forEach((a) => {
        a.classList.toggle("active", a.getAttribute("data-tab-link") === tab);
      });
      const label = document.getElementById("sectionLabel");
      const sub = document.getElementById("sectionSub");
      if (label) label.hidden = tab !== "home";
      if (sub) sub.hidden = tab !== "home";
      document.title = "AIDL Admin — " + tab.replace(/-/g, " ");
    }

    function renderTab(tab, payload) {
      const body = document.getElementById("cardBody");
      if (!body) return;
      if (tab === "home") {
        body.innerHTML = buildHomeHtml(payload);
      } else if (tab === "cards") {
        body.innerHTML = buildCardsHtml(payload);
      } else {
        body.innerHTML = buildPlaceholderHtml(tab, payload);
      }
      setUserChip(payload);
      setActiveNav(tab);
      applyUserToNav();
    }

    async function resolveUserFromTeams() {
      const params = new URLSearchParams(window.location.search);
      let fullName = params.get("full_name") || "";
      let orgName = params.get("org_name") || "";
      let email = params.get("email") || "";

      try {
        if (window.microsoftTeams) {
          await microsoftTeams.app.initialize();
          const ctx = await microsoftTeams.app.getContext();
          if (ctx && ctx.user) {
            if (ctx.user.displayName) fullName = ctx.user.displayName;
            if (ctx.user.userPrincipalName) email = email || ctx.user.userPrincipalName;
          }
        }
      } catch (e) {
        console.warn("Teams context unavailable", e);
      }
      currentUser = { fullName, orgName, email };
    }

    // The Teams tab has no browser SPA login to hand this page a token, so
    // once the caller's email is known (from Teams SSO context or the ?email=
    // query param), ask the backend for one — issued only if that email is
    // already on record as an org admin, same check the invite call itself
    // makes. A non-admin viewer simply gets no token, and the "Add admin"
    // button explains why instead of silently doing nothing.
    async function fetchSessionToken() {
      if (sessionToken || !currentUser.email) return;
      try {
        const resp = await fetch(BASE + "/admin/session/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: currentUser.email }),
        });
        if (resp.ok) {
          const data = await resp.json();
          if (data.access_token) sessionToken = data.access_token;
        }
      } catch (e) {
        console.warn("Admin session token fetch failed", e);
      }
    }

    async function loadTab(tab, { pushState } = {}) {
      activeTab = tab;
      const q = qsWithUser({
        full_name: currentUser.fullName,
        org_name: currentUser.orgName,
        email: currentUser.email,
      });

      if (pushState) {
        try {
          window.history.pushState({ tab }, "", tabUrl(tab));
        } catch (e) {
          // Ignore — cross-origin/sandboxed iframes may block history writes.
        }
      }

      try {
        const resp = await fetch(BASE + "/admin/" + tab + "/?" + q);
        if (resp.ok) {
          const data = await resp.json();
          if (tab === "home" && data.dashboard) {
            renderTab("home", data.dashboard);
            return;
          }
          if (data.placeholder) {
            renderTab(tab, data.placeholder);
            return;
          }
        }
      } catch (e) {
        console.warn("Admin API fetch failed, using server default", e);
      }

      if (tab === "home") renderTab("home", SERVER_DASHBOARD);
      else if (tab === INITIAL_TAB) renderTab(tab, SERVER_PLACEHOLDER);
      else renderTab(tab, { heading: tab, body: "Could not load this section — check your connection and try again.", items: [] });
    }

    document.getElementById("navBar").addEventListener("click", (e) => {
      const link = e.target.closest("[data-tab-link]");
      if (!link) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; // let "open in new tab" work
      e.preventDefault();
      const tab = link.getAttribute("data-tab-link");
      if (tab !== activeTab) loadTab(tab, { pushState: true });
    });

    window.addEventListener("popstate", () => {
      const match = window.location.pathname.match(/\/tabs\/([^/]+)\/?$/);
      const tab = match ? match[1] : "home";
      loadTab(tab, { pushState: false });
    });

    document.addEventListener("click", (e) => {
      const nextLink = e.target.closest("#nextLink");
      if (nextLink) {
        e.preventDefault();
        if (activeTab !== "add-admin") loadTab("add-admin", { pushState: true });
        return;
      }
      if (e.target.id === "exportBtn") {
        const q = qsWithUser({});
        window.location.href = BASE + "/admin/export/" + (q ? "?" + q : "");
        return;
      }
      if (e.target.id === "inviteBtn") {
        const msg = document.getElementById("inviteMsg");
        const full_name = ((document.getElementById("inviteName") || {}).value || "").trim();
        const email = ((document.getElementById("inviteEmail") || {}).value || "").trim().toLowerCase();
        if (!email) {
          if (msg) msg.textContent = "Enter the new teammate's work email address.";
          return;
        }
        if (!sessionToken) {
          if (msg) msg.textContent = "Only an existing admin can invite users — sign in via Teams as an admin first.";
          return;
        }
        if (msg) msg.textContent = "Sending invite…";
        fetch(BASE + "/admin/invite-user/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + sessionToken,
          },
          body: JSON.stringify({ email, full_name }),
        })
          .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
          .then(({ ok, data }) => {
            if (msg) {
              if (ok) {
                msg.textContent = data.email_sent
                  ? ("Invite sent to " + email + ".")
                  : ("Added to the Team, but the invite email could not be sent (" + (data.email_error || "check SMTP settings") + ").");
              } else {
                msg.textContent = data.message || data.error || "Invite failed";
              }
            }
            if (ok) {
              const inviteInput = document.getElementById("inviteEmail");
              const nameInput = document.getElementById("inviteName");
              if (inviteInput) inviteInput.value = "";
              if (nameInput) nameInput.value = "";
              loadTab("add-user", { pushState: false });
            }
          })
          .catch(() => {
            if (msg) msg.textContent = "Invite failed";
          });
      }
      if (e.target.id === "promoteAdminBtn") {
        const msg = document.getElementById("promoteAdminMsg");
        const email = ((document.getElementById("promoteAdminEmail") || {}).value || "").trim().toLowerCase();
        if (!email) {
          if (msg) msg.textContent = "Enter the teammate's work email address.";
          return;
        }
        if (!sessionToken) {
          if (msg) msg.textContent = "Only an existing admin can promote another admin — sign in via Teams as an admin first.";
          return;
        }
        if (msg) msg.textContent = "Sending invite…";
        const permissions = {
          approve_apps: !!((document.getElementById("permApproveApps") || {}).checked),
          access_cards: !!((document.getElementById("permAccessCards") || {}).checked),
          create_card: !!((document.getElementById("permCreateCard") || {}).checked),
        };
        fetch(BASE + "/admin/invite/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + sessionToken,
          },
          body: JSON.stringify({ email, permissions }),
        })
          .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
          .then(({ ok, data }) => {
            if (msg) {
              msg.textContent = ok
                ? ((data.admin && (data.admin.full_name || data.admin.email)) || email) + " is now an admin."
                : (data.message || data.error || "Promote failed");
            }
            if (ok) {
              const emailInput = document.getElementById("promoteAdminEmail");
              if (emailInput) emailInput.value = "";
              loadTab("add-admin", { pushState: false });
            }
          })
          .catch(() => {
            if (msg) msg.textContent = "Promote failed";
          });
      }

      if (e.target.id === "policyPublishBtn") {
        const msg = document.getElementById("policyMsg");
        const fileInput = document.getElementById("policyFile");
        const file = fileInput && fileInput.files && fileInput.files[0];
        if (!file) {
          if (msg) msg.textContent = "Choose a PDF file first.";
          return;
        }
        if (!sessionToken) {
          if (msg) msg.textContent = "Sign in via Teams as an admin first.";
          return;
        }
        const version = ((document.getElementById("policyVersion") || {}).value || "").trim();
        const effectiveDate = ((document.getElementById("policyEffectiveDate") || {}).value || "").trim();
        const form = new FormData();
        form.append("file", file);
        if (version) form.append("version", version);
        if (effectiveDate) form.append("effective_date", effectiveDate);
        if (msg) msg.textContent = "Publishing…";
        fetch(BASE + "/admin/policy/upload/", {
          method: "POST",
          headers: { "Authorization": "Bearer " + sessionToken },
          body: form,
        })
          .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
          .then(({ ok, data }) => {
            if (msg) msg.textContent = ok ? "Published " + (data.file_name || "new version") + " as the live policy." : (data.message || data.error || "Publish failed");
            if (ok) {
              loadTab("policy", { pushState: false });
              // Closes the Teams Task Module automatically if this page is
              // running inside one; harmless no-op in a normal tab view.
              try {
                if (window.microsoftTeams && window.microsoftTeams.tasks && typeof window.microsoftTeams.tasks.submit === "function") {
                  window.microsoftTeams.tasks.submit({ ok: true });
                }
              } catch (e) {}
            }
          })
          .catch(() => {
            if (msg) msg.textContent = "Publish failed";
          });
      }

      if (e.target.id === "appAddBtn") {
        const msg = document.getElementById("appAddMsg");
        const appType = e.target.getAttribute("data-app-type");
        const name = ((document.getElementById("appName") || {}).value || "").trim();
        const category = ((document.getElementById("appCategory") || {}).value || "").trim();
        const dataAllowed = ((document.getElementById("appDataAllowed") || {}).value || "").trim();
        const appStatus = ((document.getElementById("appStatus") || {}).value || "pending").trim();
        if (!name) {
          if (msg) msg.textContent = "Enter the application name.";
          return;
        }
        if (!sessionToken) {
          if (msg) msg.textContent = "Sign in via Teams as an admin first.";
          return;
        }
        if (msg) msg.textContent = "Adding…";
        fetch(BASE + "/admin/" + appType + "-apps/add/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + sessionToken,
          },
          body: JSON.stringify({ name, category, data_allowed: dataAllowed, status: appStatus }),
        })
          .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
          .then(({ ok, data }) => {
            if (msg) msg.textContent = ok ? (data.app && data.app.name || name) + " added." : (data.message || data.error || "Add failed");
            if (ok) loadTab(appType + "-apps", { pushState: false });
          })
          .catch(() => {
            if (msg) msg.textContent = "Add failed";
          });
      }

      const cardActionBtn = e.target.closest("[data-card-action]");
      if (cardActionBtn) {
        const msg = document.getElementById("cardsMsg");
        const cardId = cardActionBtn.getAttribute("data-card-id");
        const action = cardActionBtn.getAttribute("data-card-action");
        if (!sessionToken) {
          if (msg) msg.textContent = "Sign in via Teams as an admin first.";
          return;
        }
        if (action === "request") {
          if (msg) msg.textContent = "Requesting…";
          fetch(BASE + "/admin/cards/" + cardId + "/request/", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + sessionToken },
            body: "{}",
          })
            .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
            .then(({ ok, data }) => {
              if (msg) msg.textContent = ok ? "Card requested." : (data.message || data.error || "Request failed");
              if (ok) loadTab("cards", { pushState: false });
            })
            .catch(() => { if (msg) msg.textContent = "Request failed"; });
        } else if (action === "send-now") {
          if (msg) msg.textContent = "Sending…";
          fetch(BASE + "/admin/cards/" + cardId + "/send/", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + sessionToken },
            body: JSON.stringify({ when: "now" }),
          })
            .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
            .then(({ ok, data }) => {
              if (msg) msg.textContent = ok ? "Card sent to the channel." : (data.message || data.error || "Send failed");
              if (ok) loadTab("cards", { pushState: false });
            })
            .catch(() => { if (msg) msg.textContent = "Send failed"; });
        } else if (action === "schedule") {
          const input = document.querySelector('.card-schedule-input[data-card-id="' + cardId + '"]');
          const at = input && input.value;
          if (!at) {
            if (msg) msg.textContent = "Pick a date and time to schedule this card.";
            return;
          }
          if (msg) msg.textContent = "Scheduling…";
          fetch(BASE + "/admin/cards/" + cardId + "/send/", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + sessionToken },
            body: JSON.stringify({ when: "later", at }),
          })
            .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
            .then(({ ok, data }) => {
              if (msg) msg.textContent = ok ? "Card scheduled." : (data.message || data.error || "Schedule failed");
              if (ok) loadTab("cards", { pushState: false });
            })
            .catch(() => { if (msg) msg.textContent = "Schedule failed"; });
        }
      }

      if (e.target.id === "newCardBtn") {
        const msg = document.getElementById("cardsMsg");
        const title = ((document.getElementById("newCardTitle") || {}).value || "").trim();
        const description = ((document.getElementById("newCardDesc") || {}).value || "").trim();
        if (!title) {
          if (msg) msg.textContent = "Give the new card a title.";
          return;
        }
        if (!sessionToken) {
          if (msg) msg.textContent = "Sign in via Teams as an admin first.";
          return;
        }
        if (msg) msg.textContent = "Sending request…";
        fetch(BASE + "/admin/cards/request-new/", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + sessionToken },
          body: JSON.stringify({ title, description }),
        })
          .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
          .then(({ ok, data }) => {
            if (msg) msg.textContent = ok ? "Request sent to the AIDL team." : (data.message || data.error || "Request failed");
            if (ok) {
              const t = document.getElementById("newCardTitle");
              const d = document.getElementById("newCardDesc");
              if (t) t.value = "";
              if (d) d.value = "";
            }
          })
          .catch(() => { if (msg) msg.textContent = "Request failed"; });
      }
    });

    (async function init() {
      renderTab(activeTab, activeTab === "home" ? SERVER_DASHBOARD : SERVER_PLACEHOLDER);
      await resolveUserFromTeams();
      await fetchSessionToken();
      loadTab(activeTab, { pushState: false });
    })();
  </script>
</body>
</html>
