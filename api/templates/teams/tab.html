<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIDL — {{ active_tab|title }}</title>
  <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
  <script src="https://unpkg.com/adaptivecards@3.0.1/dist/adaptivecards.min.js"></script>
  <style>
    :root {
      --aidl-purple: #6264a7;
      --aidl-bg: #faf9f8;
      --aidl-card: #ffffff;
      --aidl-text: #242424;
      --aidl-muted: #616161;
      --aidl-border: #e1dfdd;
      --aidl-beige: #f3ede2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--aidl-bg);
      color: var(--aidl-text);
    }
    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 24px 32px;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--aidl-border);
      background: var(--aidl-card);
      color: var(--aidl-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .nav a.active {
      background: var(--aidl-purple);
      border-color: var(--aidl-purple);
      color: #fff;
    }
    .card-shell {
      background: var(--aidl-card);
      border: 1px solid var(--aidl-border);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    #cardHost .ac-container[style*="emphasis"],
    #cardHost .ac-container.ac-emphasis {
      background-color: var(--aidl-beige) !important;
    }
    #cardHost .ac-pushButton[style*="positive"],
    #cardHost button.ac-pushButton {
      background-color: var(--aidl-purple) !important;
      border-color: var(--aidl-purple) !important;
      color: #fff !important;
    }
    .footer-note {
      margin-top: 14px;
      font-size: 12px;
      color: var(--aidl-muted);
    }
    .loading {
      color: var(--aidl-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav" aria-label="AIDL navigation">
      {% for tab in tabs %}
      <a href="{{ tab.url }}" class="{% if tab.active %}active{% endif %}">
        <span aria-hidden="true">{{ tab.icon }}</span>
        <span>{{ tab.label }}</span>
      </a>
      {% endfor %}
    </nav>

    <div class="card-shell">
      <div id="cardHost"><p class="loading">Loading…</p></div>
    </div>

    <p class="footer-note">Sent automatically on signup · {{ org_name }}</p>
  </div>

  <script>
    const defaultCard = {{ card_json|safe }};

    async function loadCard() {
      let card = defaultCard;
      const params = new URLSearchParams(window.location.search);

      try {
        if (window.microsoftTeams) {
          await microsoftTeams.app.initialize();
          const ctx = await microsoftTeams.app.getContext();
          if (ctx && ctx.user && ctx.user.displayName) {
            params.set("full_name", ctx.user.displayName);
          }
        }
      } catch (e) {
        console.warn("Teams SDK context unavailable", e);
      }

      const cardUrl = "{{ teams_base_url }}/cards/{{ active_tab }}/?" + params.toString();
      try {
        const resp = await fetch(cardUrl);
        if (resp.ok) {
          const data = await resp.json();
          if (data.card) card = data.card;
        }
      } catch (e) {
        console.warn("Card fetch failed, using server default", e);
      }

      renderCard(card);
    }

    function renderCard(card) {
      const host = document.getElementById("cardHost");
      host.innerHTML = "";
      if (!window.AdaptiveCards) {
        host.textContent = "Adaptive Cards library failed to load.";
        return;
      }
      const adaptiveCard = new AdaptiveCards.AdaptiveCard();
      adaptiveCard.onExecuteAction = function (action) {
        if (action.getJsonTypeName && action.getJsonTypeName() === "Action.OpenUrl") {
          const url = action.url || (action._processedData && action._processedData.url);
          if (url) window.open(url, "_blank", "noopener,noreferrer");
        }
      };
      adaptiveCard.parse(card);
      host.appendChild(adaptiveCard.render());
    }

    loadCard();
  </script>
</body>
</html>
