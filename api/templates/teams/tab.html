<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIDL — {{ active_tab|title }}</title>
  <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
  <style>
    :root {
      --aidl-purple: #6264a7;
      --aidl-bg: #faf9f8;
      --aidl-card: #ffffff;
      --aidl-text: #242424;
      --aidl-muted: #616161;
      --aidl-border: #e1dfdd;
      --aidl-beige: #f3ede2;
      --aidl-yellow: #ffd335;
      --aidl-good-bg: #dff6dd;
      --aidl-good-text: #0e6b0e;
      --aidl-warning-bg: #fff4ce;
      --aidl-warning-text: #7a5900;
      --aidl-attention-bg: #fde7e9;
      --aidl-attention-text: #a4262c;
      --aidl-accent-bg: #e8ebfa;
      --aidl-accent-text: #3b3f8f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--aidl-bg);
      color: var(--aidl-text);
    }
    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 24px 32px;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--aidl-border);
      background: var(--aidl-card);
      color: var(--aidl-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .nav a.active {
      background: var(--aidl-purple);
      border-color: var(--aidl-purple);
      color: #fff;
    }
    .card-shell {
      background: var(--aidl-card);
      border: 1px solid var(--aidl-border);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    .loading { color: var(--aidl-muted); font-size: 14px; }
    h1, h2 { margin: 0 0 8px; }
    p { line-height: 1.5; }
    p.muted, .footer-note { color: var(--aidl-muted); font-size: 13px; }
    .footer-note { margin-top: 14px; }
    .note-box {
      background: var(--aidl-beige);
      border-radius: 10px;
      padding: 14px 16px;
      margin: 16px 0;
    }
    .note-box p { margin: 6px 0 0; }
    .btn.block {
      display: block;
      text-align: center;
      text-decoration: none;
      background: var(--aidl-purple);
      color: #fff;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 10px;
      margin: 18px 0 8px;
    }
    .level-toggle { display: flex; gap: 10px; margin: 14px 0; }
    .level-tile {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      background: var(--aidl-beige);
      font-weight: 700;
      color: var(--aidl-muted);
    }
    .level-tile.active { background: var(--aidl-yellow); color: var(--aidl-text); }
    .licence-card {
      background: var(--aidl-yellow);
      border-radius: 12px;
      padding: 18px;
      margin: 14px 0;
    }
    .licence-kicker { font-weight: 700; }
    .licence-sub { font-size: 13px; color: #5c4a00; }
    .licence-name { font-size: 26px; font-weight: 800; margin: 14px 0; }
    .licence-grid { display: flex; gap: 24px; margin: 10px 0; }
    .licence-grid > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .licence-grid .label { font-size: 11px; color: #5c4a00; margin-top: 8px; }
    .licence-number { font-size: 12px; color: #5c4a00; margin-top: 10px; }
    .hc-row { display: flex; gap: 14px; align-items: flex-start; margin: 16px 0; }
    .hc-icon {
      flex: 0 0 56px;
      width: 56px;
      min-height: 56px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      padding: 4px;
    }
    .hc-icon.attention { background: var(--aidl-attention-bg); color: var(--aidl-attention-text); }
    .hc-icon.warning { background: var(--aidl-warning-bg); color: var(--aidl-warning-text); }
    .hc-icon.accent { background: var(--aidl-accent-bg); color: var(--aidl-accent-text); }
    .hc-icon.default { background: var(--aidl-beige); color: var(--aidl-muted); }
    .hc-row p { margin: 2px 0 0; font-size: 13px; }
    .tl-section {
      border-radius: 10px;
      padding: 14px 16px;
      margin: 14px 0;
    }
    .tl-section.good { background: var(--aidl-good-bg); color: var(--aidl-good-text); }
    .tl-section.warning { background: var(--aidl-warning-bg); color: var(--aidl-warning-text); }
    .tl-section.attention { background: var(--aidl-attention-bg); color: var(--aidl-attention-text); }
    .tl-section ul { margin: 8px 0; padding-left: 20px; }
    .tl-section .tl-action { font-weight: 700; font-size: 13px; margin-top: 6px; }
    .btn.action {
      display: inline-block;
      text-decoration: none;
      background: var(--aidl-purple);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px 0;
    }
    .btn.action:disabled { opacity: 0.6; cursor: default; }
    .signed-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--aidl-good-text);
      background: var(--aidl-good-bg);
      font-weight: 700;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 999px;
      margin: 8px 0;
    }
    .rate-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .rate-row button {
      border: 1px solid var(--aidl-border);
      background: var(--aidl-beige);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .rate-row button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav" aria-label="AIDL navigation">
      {% for tab in tabs %}
      <a href="{{ tab.url }}" class="{% if tab.active %}active{% endif %}">
        <span aria-hidden="true">{{ tab.icon }}</span>
        <span>{{ tab.label }}</span>
      </a>
      {% endfor %}
    </nav>

    <div class="card-shell">
      <div id="cardHost"><p class="loading">Loading…</p></div>
    </div>
  </div>

  <script>
    const defaultContent = {{ content_json|safe }};
    const sessionToken = new URLSearchParams(window.location.search).get("access_token") || "";
    let currentData = defaultContent;

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // Escapes first, then turns **bold** markers into <strong> — safe
    // against injection since the bolding happens on already-escaped text.
    function mdBold(value) {
      return escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    async function loadContent() {
      let data = defaultContent;
      const params = new URLSearchParams(window.location.search);

      try {
        if (window.microsoftTeams) {
          await microsoftTeams.app.initialize();
          const ctx = await microsoftTeams.app.getContext();
          if (ctx && ctx.user && ctx.user.displayName) {
            params.set("full_name", ctx.user.displayName);
          }
        }
      } catch (e) {
        console.warn("Teams SDK context unavailable", e);
      }

      const contentUrl = "{{ teams_base_url }}/tab-content/{{ active_tab }}/?" + params.toString();
      try {
        const resp = await fetch(contentUrl);
        if (resp.ok) {
          const fetched = await resp.json();
          if (fetched && !fetched.error) data = fetched;
        }
      } catch (e) {
        console.warn("Content fetch failed, using server default", e);
      }

      renderContent(data);
    }

    function homeHtml(data) {
      const signAction = data.aup_signed
        ? '<div class="signed-badge">✓ Policy signed</div>'
        : '<button type="button" class="btn action" id="signAupBtn">I’ve read this — Sign the policy</button>';
      return (
        '<h1>' + escapeHtml(data.title) + '</h1>' +
        '<p>' + mdBold(data.body) + '</p>' +
        '<div class="note-box">' +
          '<strong>' + escapeHtml(data.policy_note_title) + '</strong>' +
          '<p>' + escapeHtml(data.policy_note_body) + '</p>' +
        '</div>' +
        '<a class="btn block" href="' + escapeHtml(data.policy_url) + '" target="_blank" rel="noopener">Read full policy</a>' +
        signAction +
        '<p id="signMsg" class="footer-note"></p>' +
        '<p class="footer-note">' + escapeHtml(data.footer) + '</p>'
      );
    }

    function learnersPermitHtml(data) {
      return (
        '<h2>' + escapeHtml(data.title) + '</h2>' +
        '<div class="level-toggle">' +
          '<div class="level-tile active">L · Learner</div>' +
          '<div class="level-tile">F · Full</div>' +
        '</div>' +
        '<div class="licence-card">' +
          '<div class="licence-kicker">AI DRIVING LICENSE</div>' +
          '<div class="licence-sub">ISSUED FOR ' + escapeHtml((data.org || "").toUpperCase()) + '</div>' +
          '<div class="licence-name">' + escapeHtml(data.name) + '</div>' +
          '<div class="licence-grid">' +
            '<div>' +
              '<span class="label">CLASS</span><strong>' + escapeHtml(data.class_label) + '</strong>' +
              '<span class="label">EXPIRES</span><strong>' + escapeHtml(data.expires) + '</strong>' +
            '</div>' +
            '<div>' +
              '<span class="label">ISSUED</span><strong>' + escapeHtml(data.issued) + '</strong>' +
              '<span class="label">STATUS</span><strong>' + escapeHtml(data.status) + '</strong>' +
            '</div>' +
          '</div>' +
          '<div class="licence-number">' + escapeHtml(data.card_number) + '</div>' +
        '</div>' +
        '<p>' + mdBold(data.body) + '</p>' +
        (data.download_url
          ? '<a class="btn action" href="' + escapeHtml(data.download_url) + '" download>Download Licence</a>'
          : '') +
        '<p class="muted">' + escapeHtml(data.share_note) + '</p>'
      );
    }

    function highwayCodeHtml(data) {
      const rows = (data.rows || []).map((row) => (
        '<div class="hc-row">' +
          '<div class="hc-icon ' + escapeHtml(row.style) + '">' + escapeHtml(row.icon) + '</div>' +
          '<div><strong>' + escapeHtml(row.title) + '</strong><p>' + mdBold(row.body) + '</p></div>' +
        '</div>'
      )).join("");
      return (
        '<h2>' + escapeHtml(data.title) + '</h2>' +
        '<p>' + escapeHtml(data.body) + '</p>' +
        rows +
        '<a class="btn block" href="' + escapeHtml(data.policy_url) + '" target="_blank" rel="noopener">Open full Highway Code</a>'
      );
    }

    function trafficLightHtml(data) {
      const sections = (data.sections || []).map((s) => (
        '<div class="tl-section ' + escapeHtml(s.style) + '">' +
          '<strong>' + escapeHtml(s.title) + '</strong>' +
          '<ul>' + (s.bullets || []).map((b) => '<li>' + escapeHtml(b) + '</li>').join("") + '</ul>' +
          '<div class="tl-action">→ ' + escapeHtml(s.action) + '</div>' +
        '</div>'
      )).join("");
      const likes = data.likes || 0;
      const dislikes = data.dislikes || 0;
      return (
        '<h2>' + escapeHtml(data.title) + '</h2>' +
        '<p>' + escapeHtml(data.body) + '</p>' +
        sections +
        '<p class="footer-note">Was this card useful?</p>' +
        '<div class="rate-row" id="rateRow">' +
          '<button type="button" data-vote="like">👍 <span id="likeCount">' + likes + '</span></button>' +
          '<button type="button" data-vote="dislike">👎 <span id="dislikeCount">' + dislikes + '</span></button>' +
        '</div>'
      );
    }

    const TAB_RENDERERS = {
      "home": homeHtml,
      "learners-permit": learnersPermitHtml,
      "highway-code": highwayCodeHtml,
      "traffic-light-check": trafficLightHtml,
    };

    function renderContent(data) {
      currentData = data;
      const host = document.getElementById("cardHost");
      const renderer = TAB_RENDERERS[data && data.tab];
      host.innerHTML = renderer ? renderer(data) : "<p>Unknown tab.</p>";
    }

    document.addEventListener("click", (e) => {
      if (e.target.id === "signAupBtn") {
        const btn = e.target;
        const msg = document.getElementById("signMsg");
        if (!sessionToken) {
          if (msg) msg.textContent = "Sign in via Teams first.";
          return;
        }
        btn.disabled = true;
        if (msg) msg.textContent = "Signing…";
        fetch("{{ teams_base_url }}/admin/aup/sign/", {
          method: "POST",
          headers: { Authorization: "Bearer " + sessionToken },
        })
          .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
          .then(({ ok }) => {
            if (ok) {
              currentData.aup_signed = true;
              renderContent(currentData);
            } else {
              btn.disabled = false;
              if (msg) msg.textContent = "Could not sign — try again.";
            }
          })
          .catch(() => {
            btn.disabled = false;
            if (msg) msg.textContent = "Could not sign — try again.";
          });
        return;
      }

      const voteBtn = e.target.closest("[data-vote]");
      if (voteBtn) {
        const row = document.getElementById("rateRow");
        const vote = voteBtn.getAttribute("data-vote");
        row.querySelectorAll("button").forEach((b) => (b.disabled = true));
        fetch("{{ teams_base_url }}/cards/traffic-light-check/rate/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ vote }),
        })
          .then((resp) => resp.json().then((data) => ({ ok: resp.ok, data })))
          .then(({ ok, data }) => {
            if (ok) {
              const likeEl = document.getElementById("likeCount");
              const dislikeEl = document.getElementById("dislikeCount");
              if (likeEl) likeEl.textContent = data.likes;
              if (dislikeEl) dislikeEl.textContent = data.dislikes;
              currentData.likes = data.likes;
              currentData.dislikes = data.dislikes;
            } else {
              row.querySelectorAll("button").forEach((b) => (b.disabled = false));
            }
          })
          .catch(() => {
            row.querySelectorAll("button").forEach((b) => (b.disabled = false));
          });
      }
    });

    loadContent();
  </script>
</body>
</html>
